<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
  <title id="title">The Lost Kingdom — original graph</title>
  <desc id="desc">Eight vertices and ten undirected unweighted edges. No secret tunnel yet. The Village to Old Bridge road is still present.</desc>
  <rect width="1100" height="570" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#18232d">
    <text x="50" y="48" font-size="27" font-weight="bold">The Lost Kingdom</text>
    <text x="50" y="79" font-size="17">Original world · 8 vertices · 10 undirected edges · no weights</text>
    <g stroke="#475569" stroke-width="3" fill="none">
      <path d="M110 285 L300 165 M110 285 L300 405 M300 165 L520 285 M300 165 L520 125 M300 405 L520 285 M300 405 L520 445 M520 285 L750 285 M520 125 L750 285 M520 445 L750 285 M750 285 L970 285"/>
    </g>
    <g fill="white" stroke="#18232d" stroke-width="3">
      <circle cx="110" cy="285" r="26"/><circle cx="300" cy="165" r="26"/>
      <circle cx="300" cy="405" r="26"/><circle cx="520" cy="285" r="26"/>
      <circle cx="520" cy="445" r="26"/><circle cx="520" cy="125" r="26"/>
      <circle cx="750" cy="285" r="26"/><circle cx="970" cy="285" r="26"/>
    </g>
    <g text-anchor="middle" font-size="22" font-weight="bold">
      <text x="110" y="293">0</text><text x="300" y="173">1</text>
      <text x="300" y="413">2</text><text x="520" y="293">3</text>
      <text x="520" y="453">4</text><text x="520" y="133">5</text>
