      <text x="300" y="457">Forest</text><text x="520" y="337">Old Bridge</text>
      <text x="520" y="497">Cave</text><text x="520" y="177">Watch Tower</text>
      <text x="750" y="337">Ruins</text><text x="970" y="337">Dragon Lair</text>
